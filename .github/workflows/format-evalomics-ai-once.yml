name: Format Evalomics AI once

on:
  push:
    paths:
      - '.github/workflows/format-evalomics-ai-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format Evalomics AI release files
        run: |
          npx prettier --write             "apps/web/app/o/[organizationId]/page.tsx"             "apps/web/app/o/[organizationId]/lab/[recommendationId]/page.tsx"             "apps/web/components/recommendation-card.tsx"             "apps/web/components/workbench/dashboard-drilldown.tsx"             "apps/web/components/workbench/evalomics-copilot.tsx"             "apps/web/components/workbench/workbench-shell.tsx"             "apps/web/app/api/evalomics-ai/route.ts"             "src/workbench/evalomics-ai.ts"
      - run: rm .github/workflows/format-evalomics-ai-once.yml
      - name: Commit formatted release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format Evalomics AI release"
          git push origin HEAD:main
