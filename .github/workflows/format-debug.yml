name: Format Debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write tests/persistence/dashboard-data.db.test.ts
          git diff -- tests/persistence/dashboard-data.db.test.ts
