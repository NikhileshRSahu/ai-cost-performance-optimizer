name: Generate web lockfile

on:
  pull_request:
    paths:
      - apps/web/package.json
      - .github/workflows/generate-web-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate exact dependency lock
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if [ -z "$(git status --porcelain -- apps/web/package-lock.json)" ]; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "build: lock web dependencies"
          git push origin HEAD:${{ github.head_ref }}
