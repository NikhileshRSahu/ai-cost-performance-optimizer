name: Prepare 21st UI branch

on:
  push:
    branches:
      - feat/21st-ui-foundation

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npx prettier --write apps/web/package.json apps/web/tsconfig.json apps/web/postcss.config.mjs apps/web/components.json apps/web/lib/utils.ts apps/web/components/ui/container-scroll-animation.tsx apps/web/components/ui/velaris.tsx apps/web/app/page.tsx apps/web/app/globals.css
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/web
          git commit -m "chore: sync lockfile and format 21st UI integration"
          git push
