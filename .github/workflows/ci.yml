name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-auth-secret-that-is-long-enough-2026
          GOOGLE_CLIENT_ID: 504485830242-1mk5p7h8aho03phd48ma9kisath17rk4.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-only-google-secret
      - name: Smoke-test public product surfaces
        run: |
          npm run start -- -p 3100 > /tmp/evalomics-next.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          smoke() {
            if ! curl -fsS "$1" > /dev/null; then
              echo "Smoke test failed: $1"
              cat /tmp/evalomics-next.log
              exit 1
            fi
          }
          smoke http://127.0.0.1:3100/evalomics-final.html
          smoke http://127.0.0.1:3100/
          smoke http://127.0.0.1:3100/demo
          smoke http://127.0.0.1:3100/auth/sign-in
          smoke http://127.0.0.1:3100/trust
        env:
          AUTH_SECRET: ci-only-auth-secret-that-is-long-enough-2026
          GOOGLE_CLIENT_ID: 504485830242-1mk5p7h8aho03phd48ma9kisath17rk4.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-only-google-secret
