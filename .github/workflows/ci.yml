name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optimizer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optimizer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run web:build
      - run: npm run test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/optimizer_test
      - run: bash scripts/db-backup-restore-drill.sh
        env:
          ALLOW_DESTRUCTIVE_RESTORE_DRILL: 'true'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: optimizer_test
          RESTORE_DATABASE: optimizer_restore
      - run: npx playwright install --with-deps chromium
      - run: npm run web:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/optimizer_test
      - run: npm audit --audit-level=high
      - run: docker build --tag ai-efficiency-intelligence:ci .
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
