name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-auth-secret-that-is-long-enough-2026
          GOOGLE_CLIENT_ID: 504485830242-1mk5p7h8aho03phd48ma9kisath17rk4.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-only-google-secret
