name: Format persistence slice

on:
  push:
    branches:
      - codex/persistent-workbench-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write src/auth src/persistence tests/auth tests/persistence src/index.ts package.json README.md vitest.config.ts vitest.db.config.ts drizzle.config.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/auth src/persistence tests/auth tests/persistence src/index.ts package.json README.md vitest.config.ts vitest.db.config.ts drizzle.config.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format persistence slice [skip ci]"
          git push
