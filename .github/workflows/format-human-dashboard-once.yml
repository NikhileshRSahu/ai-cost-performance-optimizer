name: Format human dashboard once

on:
  push:
    paths:
      - '.github/workflows/format-human-dashboard-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format dashboard release
        run: |
          npx prettier --write             "apps/web/app/o/[organizationId]/page.tsx"             "apps/web/components/workbench/workbench-shell.tsx"             "apps/web/components/workbench/dashboard-widget-grid.tsx"             "apps/web/components/workbench/dashboard-drilldown.tsx"             "apps/web/components/workbench/result-journey.tsx"
      - run: rm .github/workflows/format-human-dashboard-once.yml
      - name: Commit formatted dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format human-designed dashboard release"
          git push origin HEAD:main
