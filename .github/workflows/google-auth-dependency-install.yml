name: Google Auth Dependency Install

on:
  push:
    branches:
      - feat/google-self-serve-auth

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/google-self-serve-auth
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm install --workspace @optimizer/web --save-exact better-auth@1.7.4
      - run: |
          if git diff --quiet package.json package-lock.json apps/web/package.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/web/package.json
          git commit -m "build: add pinned Better Auth dependency"
          git push origin HEAD:feat/google-self-serve-auth
