name: Research Format Preview

on:
  push:
    branches:
      - feat/public-research-validation

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write src/research/public-cost-trace.ts tests/research/public-cost-trace.test.ts
          git diff -- src/research/public-cost-trace.ts tests/research/public-cost-trace.test.ts
