name: Google Auth Format Preview
on:
  push:
    branches:
      - feat/google-self-serve-auth
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write apps/web/app/login/page.tsx docs/security/google-auth-deployment.md README.md apps/web/lib/auth.ts apps/web/lib/runtime-session.ts apps/web/components/google-sign-in-button.tsx apps/web/components/sign-out-button.tsx apps/web/e2e/google-auth.e2e.ts
          git diff -- apps/web/app/login/page.tsx docs/security/google-auth-deployment.md README.md apps/web/lib/auth.ts apps/web/lib/runtime-session.ts apps/web/components/google-sign-in-button.tsx apps/web/components/sign-out-button.tsx apps/web/e2e/google-auth.e2e.ts
