name: Format recovery files
on:
  push:
    branches: [fix/recovery-ui-backend]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write
          apps/web/app/api/health/route.ts
          apps/web/app/login/page.tsx
          "apps/web/app/o/[organizationId]/benchmark/page.tsx"
          "apps/web/app/o/[organizationId]/import/page.tsx"
          "apps/web/app/o/[organizationId]/proof/page.tsx"
          "apps/web/app/o/[organizationId]/verify/[recommendationId]/page.tsx"
          apps/web/app/page.tsx
          apps/web/app/tools/llm-cost-calculator/page.tsx
          apps/web/components/workbench/workbench-shell.tsx
          src/workbench/upload-limits.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add               apps/web/app/api/health/route.ts               apps/web/app/login/page.tsx               "apps/web/app/o/[organizationId]/benchmark/page.tsx"               "apps/web/app/o/[organizationId]/import/page.tsx"               "apps/web/app/o/[organizationId]/proof/page.tsx"               "apps/web/app/o/[organizationId]/verify/[recommendationId]/page.tsx"               apps/web/app/page.tsx               apps/web/app/tools/llm-cost-calculator/page.tsx               apps/web/components/workbench/workbench-shell.tsx               src/workbench/upload-limits.ts
            git commit -m "chore: format recovery files"
            git push
          fi
