name: CSV Pilot Format Apply
on:
  push:
    branches:
      - feat/evalomics-csv-pilot-readiness
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/evalomics-csv-pilot-readiness
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/app/terms/page.tsx
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/terms/page.tsx
          git commit -m "style: format public terms page"
          git push origin HEAD:feat/evalomics-csv-pilot-readiness
