name: Format direct-answer branch
on:
  push:
    branches: [ux/overview-clarity-pass]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux/overview-clarity-pass
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          apps/web/app/globals.css
          'apps/web/app/o/[organizationId]/benchmark/page.tsx'
          'apps/web/app/o/[organizationId]/import/page.tsx'
          'apps/web/app/o/[organizationId]/lab/[recommendationId]/page.tsx'
          'apps/web/app/o/[organizationId]/page.tsx'
          'apps/web/app/o/[organizationId]/proof/page.tsx'
          'apps/web/app/o/[organizationId]/workloads/action.ts'
          'apps/web/app/o/[organizationId]/workloads/page.tsx'
          apps/web/components/recommendation-card.tsx
          apps/web/components/work-mri.tsx
          apps/web/components/workbench/workbench-shell.tsx
          apps/web/e2e/founder-flow.e2e.ts
          docs/release/production-auth-verification-2026-09-16.md
          docs/superpowers/plans/2026-09-17-direct-answer-workspace-plan.md
          docs/superpowers/specs/2026-09-17-direct-answer-workspace-design.md
          tests/web/import-copy.test.ts
          tests/web/recovery-states.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add .
            git commit -m "chore: format final direct-answer changes"
            git push origin HEAD:ux/overview-clarity-pass
          fi