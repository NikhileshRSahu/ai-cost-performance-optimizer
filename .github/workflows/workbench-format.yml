name: Workbench format

on:
  push:
    branches:
      - codex/workbench-verification-core

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply pinned Prettier
        run: |
          npx prettier --write tests/workbench tests/ledger tests/implementation tests/verification tests/product-events
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format workbench tests [skip ci]"
          git push
