name: Format Neon Auth

on:
  push:
    branches:
      - feat/evalomics-launch-v0

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/evalomics-launch-v0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write             'apps/web/app/api/auth/[...all]/route.ts'             'apps/web/app/login/page.tsx'             'apps/web/lib/runtime-session.ts'             'tests/web/neon-auth.test.ts'
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             'apps/web/app/api/auth/[...all]/route.ts'             'apps/web/app/login/page.tsx'             'apps/web/lib/runtime-session.ts'             'tests/web/neon-auth.test.ts'
          git commit -m "style: format Neon Auth integration"
          git push
