name: Format auth rebuild once

on:
  push:
    branches:
      - fix/recovery-ui-backend
    paths:
      - .github/workflows/format-auth-rebuild-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/recovery-ui-backend
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/lib/auth-config.ts apps/web/lib/better-auth-session.ts tests/web/auth-config.test.ts tests/web/better-auth-session.test.ts
      - run: rm .github/workflows/format-auth-rebuild-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/auth-config.ts apps/web/lib/better-auth-session.ts tests/web/auth-config.test.ts tests/web/better-auth-session.test.ts .github/workflows/format-auth-rebuild-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format auth rebuild"
          git push origin HEAD:fix/recovery-ui-backend
