name: Generate Better Auth schema once

on:
  push:
    branches:
      - fix/recovery-ui-backend
    paths:
      - .github/workflows/generate-auth-schema-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optimizer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optimizer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/optimizer_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/recovery-ui-backend
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run web:auth:migrate
      - run: |
          mkdir -p database/auth
          PGPASSWORD=postgres pg_dump \
            --host=localhost \
            --username=postgres \
            --dbname=optimizer_test \
            --schema=auth \
            --schema-only \
            --no-owner \
            --no-privileges \
            > database/auth/0001_better_auth.sql
          sed -i '/^\\\\/d' database/auth/0001_better_auth.sql
      - run: rm .github/workflows/generate-auth-schema-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/auth/0001_better_auth.sql .github/workflows/generate-auth-schema-once.yml
          git commit -m "chore(auth): generate Better Auth PostgreSQL schema"
          git push origin HEAD:fix/recovery-ui-backend
