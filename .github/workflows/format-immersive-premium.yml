name: Format launch beta
on:
  push:
    branches: [fix/product-hardening]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write "apps/web/app/o/[organizationId]/pilot/page.tsx" "apps/web/app/pricing/page.tsx" "apps/web/app/privacy/page.tsx" "apps/web/app/terms/page.tsx" "tests/persistence/workspace-invitations.db.test.ts" "apps/web/app/o/[organizationId]/import/page.tsx" "apps/web/components/site-chrome.tsx" "apps/web/app/o/[organizationId]/settings/action.ts" "apps/web/app/o/[organizationId]/settings/page.tsx" "apps/web/app/login/page.tsx" "apps/web/app/page.tsx"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add apps/web tests
            git commit -m "chore: format launch beta"
            git push
          fi
