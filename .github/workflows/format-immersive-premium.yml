name: Format product hardening
on:
  push:
    branches: [fix/product-hardening]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write "apps/web/**/*.{ts,tsx,css,json}" "src/**/*.ts" "tests/**/*.ts" "drizzle/meta/*.json" ".env.example"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add apps/web src tests drizzle/meta .env.example
            git commit -m "chore: format product hardening"
            git push
          fi
