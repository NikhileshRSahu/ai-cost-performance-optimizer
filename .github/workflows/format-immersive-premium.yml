name: Format immersive premium
on:
  push:
    branches:
      - feat/production-ready-premium-v1
      - ui/launch-ui-evalomics
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/app/page.tsx apps/web/components/marketing/launch-ui-home.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add apps/web/app/page.tsx apps/web/components/marketing/launch-ui-home.tsx
            git commit -m "chore: format Launch UI adaptation"
            git push
          fi
