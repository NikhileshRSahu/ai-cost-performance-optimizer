name: Format product hardening
on:
  push:
    branches: [fix/product-hardening]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          apps/web/app/api/fx/route.ts
          apps/web/app/page.tsx
          apps/web/app/tools/ai-agent-cost/page.tsx
          apps/web/app/tools/cost-per-outcome/page.tsx
          apps/web/app/tools/prompt-cache-savings/page.tsx
          apps/web/components/ai-agent-cost-calculator.tsx
          apps/web/components/cost-per-outcome-calculator.tsx
          apps/web/components/llm-cost-calculator.tsx
          apps/web/components/prompt-cache-savings-calculator.tsx
          apps/web/e2e/customer-loop.e2e.ts
          apps/web/e2e/free-tools.e2e.ts
          apps/web/hooks/use-fx-rate.ts
          tests/web/fx-route.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add .
            git commit -m "chore: format product hardening"
            git push
          fi
