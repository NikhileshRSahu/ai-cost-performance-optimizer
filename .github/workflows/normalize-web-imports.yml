name: Normalize web imports

on:
  push:
    branches:
      - codex/founder-workbench-ui

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Normalize relative TypeScript imports for Next
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path in Path("apps/web").rglob("*"):
              if path.suffix not in {".ts", ".tsx"}:
                  continue
              text = path.read_text()
              text = re.sub(r"(from\s+['\"](?:\.{1,2}/[^'\"]+))\.js(['\"])", r"\1\2", text)
              text = re.sub(r"(import\s+['\"](?:\.{1,2}/[^'\"]+))\.js(['\"])", r"\1\2", text)
              path.write_text(text)
          PY
      - name: Commit normalized imports
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web
          git commit -m "fix: use Next-resolvable web import specifiers [skip ci]"
          git push
