name: Final Format Apply
on:
  push:
    branches:
      - feat/google-self-serve-auth-v2
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/google-self-serve-auth-v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/components/proovance-mark.tsx docs/brand/cowork-launch-handoff.md README.md
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/proovance-mark.tsx docs/brand/cowork-launch-handoff.md README.md
          git commit -m "style: apply final Proovance formatting"
          git push origin HEAD:feat/google-self-serve-auth-v2
