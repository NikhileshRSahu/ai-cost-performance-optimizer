name: Format simplified customer flow
on:
  push:
    branches: [ux/overview-clarity-pass]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ux/overview-clarity-pass
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          'apps/web/app/o/[organizationId]/lab/[recommendationId]/page.tsx'
          apps/web/e2e/customer-loop.e2e.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add .
            git commit -m "chore: format simplified customer flow"
            git push origin HEAD:ux/overview-clarity-pass
          fi
