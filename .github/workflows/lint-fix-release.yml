name: Release Lint Fix

on:
  push:
    branches:
      - preview/section2-container-scroll

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: preview/section2-container-scroll
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply safe ESLint fixes
        run: npm run lint -- --fix
        continue-on-error: true
      - name: Reformat
        run: npm run format
      - name: Commit safe fixes
        run: |
          if git diff --quiet; then
            echo "No auto-fixes available"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply final lint autofixes"
          git push origin HEAD:preview/section2-container-scroll
