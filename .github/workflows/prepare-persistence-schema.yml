name: Prepare persistence schema

on:
  push:
    branches:
      - codex/persistent-workbench-foundation

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format and generate migration
        run: |
          npx prettier --write drizzle.config.ts src/persistence/schema.ts tests/persistence/schema.test.ts
          npm run db:generate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle.config.ts src/persistence/schema.ts tests/persistence/schema.test.ts drizzle/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: format schema and generate migration [skip ci]"
          git push
