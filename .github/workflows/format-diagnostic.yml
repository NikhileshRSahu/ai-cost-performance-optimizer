name: Format diagnostic

on:
  push:
    branches:
      - codex/detectors-benchmarks

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact Prettier output
        run: |
          npx prettier --write src/benchmarks/confidence.ts src/benchmarks/evaluate.ts src/detectors/detectors.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/benchmarks/confidence.ts src/benchmarks/evaluate.ts src/detectors/detectors.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "style: apply repository prettier [skip ci]"
          git push
