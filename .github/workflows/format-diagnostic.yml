name: Format diagnostic

on:
  push:
    branches:
      - codex/detectors-benchmarks

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print exact Prettier output
        run: |
          npx prettier --write src/benchmarks/confidence.ts src/benchmarks/evaluate.ts src/detectors/detectors.ts
          for file in src/benchmarks/confidence.ts src/benchmarks/evaluate.ts src/detectors/detectors.ts; do
            echo "===== ${file} ====="
            cat "${file}"
            echo "===== END ${file} ====="
          done
